# Copy to .github/workflows/ci.yml to enable CI (requires a token with the `workflow` scope to push).
name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run build:cli
      - run: node cli/dist/cli.js --prod --no-fail   # dogfood: report fresh deps of this repo
      - run: cd cli && npm pack --dry-run
      - run: xvfb-run -a npm run test:integration
      - run: npx --yes @vscode/vsce@3 package --no-dependencies
      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: "*.vsix"
